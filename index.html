    // Store helper
    function getStoredData() {
      try {
        const d = localStorage.getItem('briksystem12_app_state');
        if (d) return JSON.parse(d);
      } catch (e) {}
      localStorage.setItem('briksystem12_app_state', JSON.stringify(DEFAULT_DATA));
      return DEFAULT_DATA;
    }

    function saveStoredData(data) {
      localStorage.setItem('briksystem12_app_state', JSON.stringify(data));
    }

    // =========================================================================
    // Main App Component
    // =========================================================================
    function App() {
      const [data, setData] = useState(getStoredData);
      const [currentRoute, setCurrentRoute] = useState(() => {
        const hash = window.location.hash;
        return hash || '#/dashboard';
      });
      const [activeBizId, setActiveBizId] = useState('biz_01');
      const [activeRole, setActiveRole] = useState('OWNER');
      const [activeTab, setActiveTab] = useState('home'); // 'home' | 'leads' | 'customers' | 'jobs' | 'appointments' | 'reviews' | 'automations' | 'website' | 'team' | 'settings'
      
      // Modals
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [toastMessage, setToastMessage] = useState(null);

      // Toast notification helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      // Hash routing listener
      useEffect(() => {
        const handleHashChange = () => {
          setCurrentRoute(window.location.hash || '#/dashboard');
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      // Persist state updates
      const updateData = (updater) => {
        setData((prev) => {
          const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
          saveStoredData(next);
          return next;
        });
      };

      // Current Business & Settings
      const currentBiz = data.businesses.find((b) => b.id === activeBizId) || data.businesses[0];
      const currentWebSettings = data.website_settings[activeBizId] || data.website_settings['biz_01'];

      // Tenant-filtered records
      const bizCustomers = useMemo(() => data.customers.filter((c) => c.business_id === activeBizId), [data, activeBizId]);
      const bizLeads = useMemo(() => data.leads.filter((l) => l.business_id === activeBizId), [data, activeBizId]);
      const bizJobs = useMemo(() => data.jobs.filter((j) => j.business_id === activeBizId), [data, activeBizId]);
      const bizAppointments = useMemo(() => data.appointments.filter((a) => a.business_id === activeBizId), [data, activeBizId]);
      const bizServices = useMemo(() => data.services.filter((s) => s.business_id === activeBizId), [data, activeBizId]);
      const bizReviews = useMemo(() => data.reviews.filter((r) => r.business_id === activeBizId), [data, activeBizId]);
      const bizAutomations = useMemo(() => data.automations.filter((a) => a.business_id === activeBizId), [data, activeBizId]);
      const bizMessages = useMemo(() => data.messages.filter((m) => m.business_id === activeBizId), [data, activeBizId]);
      const bizTeam = useMemo(() => data.profiles.filter((p) => p.business_id === activeBizId), [data, activeBizId]);

      // Route parser
      const isPublicSite = currentRoute.startsWith('#/site');
      const publicSlug = isPublicSite ? currentRoute.replace('#/site/', '').replace('#/site', '') : null;
      const publicBiz = publicSlug ? data.businesses.find((b) => b.slug === publicSlug) || currentBiz : currentBiz;

      // -----------------------------------------------------------------------
      // Business Actions
      // -----------------------------------------------------------------------
      const handleAddLead = (leadInput) => {
        const newLead = {
          id: `lead_${Date.now()}`,
          business_id: activeBizId,
          ...leadInput,
          status: 'NEW',
          created_at: new Date().toISOString(),
        };

        // Trigger SMS automation
        const autoMsg = {
          id: `msg_${Date.now()}`,
          business_id: activeBizId,
          recipient: `${newLead.phone} (${newLead.name})`,
          message: `Hi ${newLead.name}, thank you for contacting ${currentBiz.name}! We received your request for ${newLead.service_requested}. Our dispatch team is on it.`,
          status: 'SENT',
          time: 'Just now',
        };

        updateData((prev) => ({
          ...prev,
          leads: [newLead, ...prev.leads],
          messages: [autoMsg, ...prev.messages],
        }));

        showToast(`New lead from ${newLead.name} received! Instant SMS confirmation dispatched.`);
        setModalState({ type: null, data: null });
      };

      const handleAddCustomer = (custInput) => {
        const newCust = {
          id: `cust_${Date.now()}`,
          business_id: activeBizId,
          ...custInput,
        };
        updateData((prev) => ({
          ...prev,
          customers: [newCust, ...prev.customers],
        }));
        showToast(`Customer ${newCust.first_name} ${newCust.last_name} added.`);
        setModalState({ type: null, data: null });
      };

      const handleConvertLeadToCustomer = (lead) => {
        const parts = lead.name.split(' ');
        const newCust = {
          id: `cust_${Date.now()}`,
          business_id: activeBizId,
          first_name: parts[0] || 'Client',
          last_name: parts.slice(1).join(' ') || 'Customer',
          email: lead.email,
          phone: lead.phone,
          address: 'Metro City Area',
          city: currentBiz.city,
          province: currentBiz.province,
          postal_code: currentBiz.postal_code,
          notes: `Converted from lead (${lead.service_requested}). ${lead.description || ''}`,
        };

        updateData((prev) => ({
          ...prev,
          customers: [newCust, ...prev.customers],
          leads: prev.leads.map((l) => (l.id === lead.id ? { ...l, status: 'CONVERTED' } : l)),
        }));

        showToast(`Lead converted to Customer ${newCust.first_name} ${newCust.last_name}!`);
      };

      const handleCreateJob = (jobInput) => {
        const newJob = {
          id: `job_${Date.now()}`,
          business_id: activeBizId,
          ...jobInput,
          created_at: new Date().toISOString(),
        };
        updateData((prev) => ({
          ...prev,
          jobs: [newJob, ...prev.jobs],
        }));
        showToast(`Job "${newJob.title}" created successfully.`);
        setModalState({ type: null, data: null });
      };

      const handleUpdateJobStatus = (jobId, newStatus) => {
        const job = data.jobs.find((j) => j.id === jobId);
        if (!job) return;

        const isCompleted = newStatus === 'COMPLETED';
        const customer = data.customers.find((c) => c.id === job.customer_id);

        let newMessages = [...data.messages];
        if (isCompleted && customer) {
          // Automation: trigger review request
          const reviewMsg = {
            id: `msg_${Date.now()}`,
            business_id: activeBizId,
            recipient: `${customer.phone} (${customer.first_name} ${customer.last_name})`,
            message: `Hi ${customer.first_name}, your service for "${job.title}" is complete! How did we do? Leave us a quick 5-star review: http://localhost:3000/#/site/${currentBiz.slug}`,
            status: 'SENT',
            time: 'Just now',
          };
          newMessages = [reviewMsg, ...newMessages];
          showToast(`Job marked Completed! Automated 5-Star review request SMS sent to ${customer.first_name}.`);
        } else {
          showToast(`Job status updated to ${newStatus}.`);
        }

        updateData((prev) => ({
          ...prev,
          jobs: prev.jobs.map((j) =>
            j.id === jobId
              ? {
                  ...j,
                  status: newStatus,
                  completed_at: isCompleted ? new Date().toISOString() : j.completed_at,
                }
              : j
          ),
          messages: newMessages,
        }));
      };

      const handleAddAppointment = (aptInput) => {
        const newApt = {
          id: `apt_${Date.now()}`,

          {modalState.type === 'public_book' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-slate-900">Request Service / Free Quote</h3>
                  <button onClick={() => setModalState({ type: null })} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = new FormData(e.target);
                    handleAddLead({
                      name: form.get('name'),
                      phone: form.get('phone'),
                      email: form.get('email'),
                      service_requested: form.get('service') || modalState.data?.serviceName || 'General Quote',
                      description: form.get('description'),
                      preferred_time: form.get('preferred_time'),
                      source: 'Public Modal',
                    });
                  }}
                  className="space-y-3"
                >
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Full Name *</label>
                    <input name="name" required placeholder="John Doe" className="w-full px-3 py-2 border rounded-xl text-sm" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Phone *</label>
                      <input name="phone" required placeholder="(555) 000-0000" className="w-full px-3 py-2 border rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Email</label>
                      <input name="email" type="email" placeholder="john@example.com" className="w-full px-3 py-2 border rounded-xl text-sm" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Service</label>
                    <select name="service" defaultValue={modalState.data?.serviceName} className="w-full px-3 py-2 border rounded-xl text-sm bg-white">
                      {bizServices.map((s) => (
                        <option key={s.id} value={s.name}>{s.name} ({s.price_description})</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Preferred Time</label>
                    <input name="preferred_time" placeholder="e.g. Tomorrow morning or ASAP" className="w-full px-3 py-2 border rounded-xl text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Job Details</label>
                    <textarea name="description" rows="2" placeholder="Briefly describe what you need..." className="w-full px-3 py-2 border rounded-xl text-sm"></textarea>
                  </div>
                  <button type="submit" className="w-full bg-sky-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-sky-700 transition">
                    Send to Dispatch 🚀
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>

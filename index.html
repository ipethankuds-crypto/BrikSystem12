        extend: {

            ember: {

            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],

            'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'float-slow': 'floatSlow 4s ease-in-out infinite',
            'pulse-subtle': 'pulseSubtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'gradient-flow': 'gradientFlow 8s ease infinite',
            'shake': 'shake 0.4s ease-in-out',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.6' },
            },
            gradientFlow: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '20%, 60%': { transform: 'translateX(-6px)' },
              '40%, 80%': { transform: 'translateX(6px)' },
            }
          }
        }
      }
    }

          window.lucide.createIcons();

      ],
      customers: [
        { id: 'cust_1', name: 'John Smith', phone: '(416) 555-0101', email: 'john.smith@gmail.com', jobsCount: 3, address: '142 King St West, Toronto, ON' },
        { id: 'cust_2', name: 'Sarah Wilson', phone: '(416) 555-0102', email: 'sarah.w@outlook.com', jobsCount: 1, address: '88 Bloor St East, Toronto, ON' },

    function loadStore() {
      try {
        const stored = localStorage.getItem('brik_systems_data_v2');
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      localStorage.setItem('brik_systems_data_v2', JSON.stringify(INITIAL_PORTAL_DATA));
      return INITIAL_PORTAL_DATA;
    }

    function saveStore(data) {
      localStorage.setItem('brik_systems_data_v2', JSON.stringify(data));
    }

    // =========================================================================
    // Main Application Component
    // =========================================================================
    function App() {
      const [route, setRoute] = useState(() => window.location.hash || '#/');
      const [data, setData] = useState(loadStore);
      const [modal, setModal] = useState({ type: null, data: null });
      const [toast, setToast] = useState(null);

      // Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem('brik_auth_token') === 'authenticated_dexter';
      });
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      // Listen to URL Hash routing
      useEffect(() => {
        const handleHashChange = () => {
          const currentHash = window.location.hash || '#/';
          setRoute(currentHash);
          window.scrollTo({ top: 0, behavior: 'smooth' });

          // Protect portal routes
          if (currentHash.startsWith('#/portal') && !isAuthenticated) {
            window.location.hash = '#/login';
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, [isAuthenticated]);

      const updateData = (updater) => {
        setData((prev) => {
          const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
          saveStore(next);
          return next;
        });
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        setIsLoggingIn(true);

        const cleanEmail = loginEmail.toLowerCase().trim();
        const cleanPass = loginPassword.trim();

        setTimeout(() => {
          if (cleanEmail === 'dexter125555@gmail.com' && cleanPass === 'serish12') {
            setIsAuthenticated(true);
            localStorage.setItem('brik_auth_token', 'authenticated_dexter');
            showToast('Welcome back, Dexter!');
            setLoginError('');
            window.location.hash = '#/portal';
          } else {
            setLoginError('Invalid email or password. Please check your credentials and try again.');
          }
          setIsLoggingIn(false);
        }, 400);
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        localStorage.removeItem('brik_auth_token');
        setLoginEmail('');
        setLoginPassword('');
        showToast('Logged out successfully.');
        window.location.hash = '#/login';
      };

      const handleAddLead = (leadInput) => {
        const newLead = {
          id: `lead_${Date.now()}`,
          ...leadInput,
          status: 'NEW',
          date: 'Just now',
        };
        const newMsg = {
          id: `msg_${Date.now()}`,
          to: `${newLead.name} (${newLead.phone || 'Phone'})`,
          text: `Hi ${newLead.name}, thank you for contacting us! We received your request for ${newLead.service}. Our team will contact you shortly.`,
          status: 'SENT',
          time: 'Just now',
        };
        updateData((prev) => ({
          ...prev,
          leads: [newLead, ...prev.leads],
          messages: [newMsg, ...prev.messages],
        }));
        showToast(`Thank you, ${newLead.name}! Your request was submitted.`);
        setModal({ type: null });
      };

      const handleJobStatusChange = (jobId, newStatus) => {
        const job = data.jobs.find((j) => j.id === jobId);
        if (!job) return;

        let newMessages = [...data.messages];
        if (newStatus === 'COMPLETED') {
          const newMsg = {
            id: `msg_${Date.now()}`,
            to: `${job.customer}`,
            text: `Hi ${job.customer}, your job "${job.service}" was marked completed! How did we do? Leave us a review: https://briksystems.io/review`,
            status: 'SENT',
            time: 'Just now',
          };
          newMessages = [newMsg, ...newMessages];
          showToast(`Job Completed! Automated 5-Star review request sent.`);
        } else {
          showToast(`Job status updated to ${newStatus}`);
        }

        updateData((prev) => ({
          ...prev,
          jobs: prev.jobs.map((j) => (j.id === jobId ? { ...j, status: newStatus } : j)),
          messages: newMessages,
        }));
      };

      // SHARED MARKETING HEADER

                  <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Company Name</label>
                      <input defaultValue="Northside Plumbing" className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Owner Email</label>
                      <input defaultValue="dexter125555@gmail.com" disabled className="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 text-slate-500 cursor-not-allowed" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Phone Line</label>
                      <input defaultValue="(416) 555-0100" className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <button onClick={() => showToast('Settings saved!')} className="bg-slate-900 text-white font-semibold text-sm px-4 py-2 rounded-lg hover:bg-slate-800 transition">
                      Save Settings
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* ================================================================= */}
          {/* MODALS */}
          {/* ================================================================= */}

          {/* Add Job Modal */}
          {modal.type === 'add_job' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4 animate-fade-in-up">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-slate-900">Create New Job</h3>
                  <button onClick={() => setModal({ type: null })} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = new FormData(e.target);
                    const newJob = {
                      id: `job_${Date.now()}`,
                      customer: form.get('customer'),
                      service: form.get('service'),
                      status: 'PENDING',
                      date: form.get('date'),
                      price: parseFloat(form.get('price')) || 200,
                      time: form.get('time') || '10:00 AM',
                      tech: form.get('tech') || 'Dave M.',
                    };
                    updateData((prev) => ({
                      ...prev,
                      jobs: [newJob, ...prev.jobs],
                    }));
                    showToast(`Job for ${newJob.customer} created.`);
                    setModal({ type: null });
                  }}
                  className="space-y-3 text-sm"
                >
                  <div>
                    <label className="block text-xs font-semibold mb-1">Customer Name *</label>
                    <input name="customer" required placeholder="John Smith" className="w-full px-3 py-2 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Service *</label>
                    <input name="service" required placeholder="Drain Cleaning" className="w-full px-3 py-2 border rounded-lg" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold mb-1">Date</label>
                      <input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full px-3 py-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Price ($)</label>
                      <input name="price" type="number" defaultValue="250" className="w-full px-3 py-2 border rounded-lg" />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-ember-500 hover:bg-ember-600 text-white font-semibold py-2.5 rounded-lg transition shadow">
                    Create Job
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Add Lead Modal */}
          {modal.type === 'add_lead' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4 animate-fade-in-up">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-slate-900">Add Lead</h3>
                  <button onClick={() => setModal({ type: null })} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = new FormData(e.target);
                    handleAddLead({
                      name: form.get('name'),
                      phone: form.get('phone'),
                      service: form.get('service'),
                      source: 'Portal Entry',
                    });
                  }}
                  className="space-y-3 text-sm"
                >
                  <div>
                    <label className="block text-xs font-semibold mb-1">Name *</label>
                    <input name="name" required placeholder="Full Name" className="w-full px-3 py-2 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Phone *</label>
                    <input name="phone" required placeholder="(416) 555-0100" className="w-full px-3 py-2 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Service Requested</label>
                    <input name="service" defaultValue="General Service" className="w-full px-3 py-2 border rounded-lg" />
                  </div>
                  <button type="submit" className="w-full bg-ember-500 hover:bg-ember-600 text-white font-semibold py-2.5 rounded-lg transition shadow">
                    Save Lead
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* View Portfolio Project Modal */}
          {modal.type === 'view_project' && modal.data && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 animate-fade-in-up">
                <div className="flex justify-between items-center">
                  <div>
                    <span className="text-xs font-semibold text-ember-600 uppercase">{modal.data.type}</span>
                    <h3 className="text-xl font-bold text-slate-900">{modal.data.name}</h3>
                  </div>
                  <button onClick={() => setModal({ type: null })} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <img src={modal.data.img} alt={modal.data.name} className="w-full h-48 object-cover rounded-xl" />
                <p className="text-sm text-slate-600">{modal.data.desc}</p>
                <div className="bg-slate-50 p-4 rounded-xl space-y-2 text-xs">
                  <p className="font-bold text-slate-900">Included System Modules:</p>
                  <div className="flex flex-wrap gap-2">
                    {modal.data.tags.map((t) => (
                      <span key={t} className="bg-white border border-slate-200 px-2.5 py-1 rounded-md text-slate-700 font-medium">
                        ✓ {t}
                      </span>
                    ))}
                  </div>
                </div>
                <button
                  onClick={() => {
                    setModal({ type: null });
                    window.location.hash = '#/contact';
                  }}
                  className="w-full bg-ember-500 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-ember-600 transition shadow"
                >
                  Build a Similar System for My Business
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the React Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
